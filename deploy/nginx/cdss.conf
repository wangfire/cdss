# =====================================================================
# CDSS 生产环境 Nginx 反向代理配置（WP-A/WP-C）
# - TLS 终结：证书放 deploy/nginx/certs/fullchain.pem + privkey.pem
# - /api/ → api:8080（转发头透传，登录限流按真实客户端 IP 分区）
# - / → 前端静态 dist（SPA 回退）
# =====================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name cdss.hospital.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cdss.hospital.local _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 医疗文书上传体量
    client_max_body_size 50m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 后端 API（转发头透传：登录限流按真实客户端 IP 分区）
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prometheus 指标（限内网监控抓取，不对外）
    location /metrics {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 前端静态资源（vite build 产物挂载到 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
